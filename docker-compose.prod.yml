# 生产部署：应用容器
# 宿主机 MySQL：DATABASE_URL 使用 host.docker.internal:3306
#
#   cp .env.production.example .env.production  # 填写后
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  duet:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: duet-web:latest
    container_name: duet-web
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      # 3010：宿主机 3000 常被其他 Node 占用；Nginx 反代至此
      - "127.0.0.1:3010:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
